[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt-jax"
version = "0.1.0"
description = "A tiny GPT built with JAX/Flax NNX that trains and runs on a laptop CPU."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "jax==0.6.2",
    "flax==0.10.7",
    "grain==0.2.13",
    "optax==0.2.4",
    "orbax-checkpoint==0.11.13",
    "tiktoken==0.9.0",
    "gradio==6.5.1",
    "matplotlib==3.10.8",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]
